name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run application check script
        run: |
          chmod +x ./app/check_app.sh
          cd app
          ./check_app.sh

      - name: Display environment information
        env:
          FAKE_API_TOKEN: ${{ secrets.FAKE_API_TOKEN }}
          ENV_TYPE: ${{ secrets.ENV_TYPE }}
        run: |
          echo "Environnement : $ENV_TYPE"
          echo "Runner : $RUNNER_OS"
          echo "Token chargé avec succès"

      - name: Display index.html content
        run: cat app/index.html

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Validate Ansible playbook
        run: |
          ansible-playbook --syntax-check ansible/deploy.yml

      - name: Simulate deployment
        run: |
          echo "=== Déploiement simulé ==="
          echo "Le pipeline CI est validé."
          echo "Le playbook Ansible est valide."
          echo "Le déploiement réel a été testé avec succès sur la VM Debian."