  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Validate Ansible playbook
        run: |
          ansible-playbook --syntax-check ansible/deploy.yml

      - name: Simulate deployment
        run: |
          echo "=== Déploiement simulé ==="
          echo "Le pipeline CI est validé."
          echo "Le playbook Ansible est valide."
          echo "Le déploiement réel a été testé avec succès sur la VM Debian."