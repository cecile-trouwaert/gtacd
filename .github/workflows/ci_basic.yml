name: Basic CI Workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run application check script
        run: |
          chmod +x ./app/check_app.sh
          cd app
          ./check_app.sh

      - name: Display environment information
        env:
          FAKE_API_TOKEN: ${{ secrets.FAKE_API_TOKEN }}
          ENV_TYPE: ${{ secrets.ENV_TYPE }}
        run: |
          echo "Environnement : $ENV_TYPE"
          echo "Runner : $RUNNER_OS"
          echo "Token chargé avec succès"
          
      - name: Display index.html content
        run: cat app/index.html